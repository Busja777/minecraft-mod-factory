name: Skin pack — refresh project page

# Manual: renders every version of an imported skin pack, writes legend/summary/notes via Claude,
# generates "<Name>.png" + "<Name> Cover.png" via ChatGPT and opens an issue with the full kit
# (all CurseForge fields, gallery title MCPEDL, ready-to-paste description).
on:
  workflow_dispatch:
    inputs:
      pack:
        description: 'Skin pack slug in data/skins (e.g. glowing-samurai)'
        type: string
        required: true
      mode:
        description: 'refresh = existing CurseForge project, new = project still to create'
        type: choice
        options: [refresh, new]
        default: refresh
      forceImages:
        description: 'Regenerate logo and cover even if they exist'
        type: boolean
        default: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: mod-factory
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Install Chromium for skin renders
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Render all versions
        run: node scripts/render-skins.js --pack "${{ inputs.pack }}" --all
      - name: Legend, summary and notes via Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/skin-meta.js --pack "${{ inputs.pack }}"
      - name: Logo and cover via ChatGPT
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/build-images.js --skinpack "${{ inputs.pack }}" ${{ inputs.forceImages && '--force' || '' }}
      - name: Write kit
        run: node scripts/kit.js --skinpack "${{ inputs.pack }}" ${{ inputs.mode == 'refresh' && '--refresh' || '' }}
      - name: Commit data
        run: |
          git config user.name "Mod Factory Bot"
          git config user.email "bot@modfactory.dev"
          git add data/
          if git diff --staged --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "chore(skins): refresh ${{ inputs.pack }} [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
      - name: Open issue with kit
        uses: actions/github-script@v7
        with:
          script: |
            const issue = JSON.parse(require('fs').readFileSync('./kit-issue.json', 'utf-8'));
            const { data } = await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, ...issue });
            core.notice(`Kit issue created: ${data.html_url}`);
