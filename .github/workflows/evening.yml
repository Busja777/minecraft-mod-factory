name: Evening — update a due project

# One leg per CurseForge account (config.games.<key>.account; Java and Bedrock share "minecraft").
# Every account draws its own random time between 18:00 and 21:00 Europe/Berlin per day
# (config.windows.evening); the cron fires every 30 minutes from 17:30 and the gate starts the legs
# whose slot falls into this half hour. Each account updates at most one project per day: its
# projects take turns (longest without an update first), each at least 23 days after its last
# upload (config.updateIntervalDays). Accounts without a published project have no leg.
on:
  schedule:
    - cron: '*/30 17-20 * * *'
      timezone: Europe/Berlin
  workflow_dispatch:
    inputs:
      force:
        description: 'Run now, ignoring the time window and the once-per-day rule (needs modId or account)'
        type: boolean
        default: false
      modId:
        description: 'Update this modId (default: earliest due project of the account)'
        type: string
        default: ''
      account:
        description: 'Only this CurseForge account (e.g. minecraft, stardewvalley)'
        type: string
        default: ''
      releaseType:
        description: 'CurseForge release type for the upload (alpha for tests)'
        type: choice
        options: [release, beta, alpha]
        default: release

env:
  PLATFORMS: curseforge
  RELEASE_TYPE: ${{ inputs.releaseType || 'release' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      matrix: ${{ steps.gate.outputs.matrix }}
      any: ${{ steps.gate.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Decide which accounts run in this fire
        id: gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force && 'true' || 'false' }}
          INPUT_MOD_ID: ${{ inputs.modId }}
          INPUT_ACCOUNT: ${{ inputs.account }}
        run: node scripts/schedule-gate.js --window evening --per-account

  update:
    # The gate recognises today's run of an account by this name (update-<account>).
    name: update-${{ matrix.account }}
    needs: gate
    if: needs.gate.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gate.outputs.matrix) }}
    # The Minecraft account keeps sharing its group with the morning and refresh workflows.
    concurrency:
      group: ${{ matrix.account == 'minecraft' && 'mod-factory' || format('mod-factory-{0}', matrix.account) }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write

    steps:
      - name: Wait for this account's slot
        if: matrix.sleep > 0
        run: sleep $(( ${{ matrix.sleep }} * 60 ))

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        run: npm ci

      - name: Pick due project
        id: select
        env:
          CF_CORE_API_KEY: ${{ secrets.CF_CORE_API_KEY }}
          MODE: update
          ACCOUNT: ${{ matrix.account }}
          INPUT_MOD_ID: ${{ inputs.modId }}
        run: node scripts/select-mode.js

      - name: Improve mod via Claude API
        if: steps.select.outputs.mode == 'update' && steps.select.outputs.kind == 'mod'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/improve.js --mod "${{ steps.select.outputs.modId }}"

      - name: Build (with one auto-fix retry)
        if: steps.select.outputs.mode == 'update' && steps.select.outputs.kind == 'mod'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: scripts/build.sh "${{ steps.select.outputs.modId }}"

      - name: Publish update to CurseForge
        if: steps.select.outputs.mode == 'update' && steps.select.outputs.kind == 'mod'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          MODRINTH_API_TOKEN: ${{ secrets.MODRINTH_API_TOKEN }}
        run: node scripts/publish.js --mod "${{ steps.select.outputs.modId }}"

      # ── Skin pack update: next prepared version (local U-folder import) ─────
      - name: Install Chromium for skin renders
        if: steps.select.outputs.mode == 'update' && steps.select.outputs.kind == 'skinpack'
        run: node node_modules/playwright-core/cli.js install --with-deps chromium

      - name: Render new skins
        if: steps.select.outputs.mode == 'update' && steps.select.outputs.kind == 'skinpack'
        run: node scripts/render-skins.js --pack "${{ steps.select.outputs.modId }}"

      - name: Write update note via Claude
        if: steps.select.outputs.mode == 'update' && steps.select.outputs.kind == 'skinpack'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/skin-meta.js --pack "${{ steps.select.outputs.modId }}"

      - name: Release skin pack version
        id: skinrelease
        if: steps.select.outputs.mode == 'update' && steps.select.outputs.kind == 'skinpack'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_CORE_API_KEY: ${{ secrets.CF_CORE_API_KEY }}
        run: node scripts/skin-release.js --pack "${{ steps.select.outputs.modId }}"

      # ── Any other game: next prepared file of a project created once by hand ─
      # The token of the leg's account is handed over under the name the game expects (config.games).
      - name: Release prepared version
        if: steps.select.outputs.mode == 'update' && steps.select.outputs.kind == 'file'
        env:
          ACCOUNT_TOKEN: ${{ secrets[matrix.tokenEnv] }}
          CF_CORE_API_KEY: ${{ secrets.CF_CORE_API_KEY }}
        run: |
          export "${{ matrix.tokenEnv }}=${ACCOUNT_TOKEN}"
          node scripts/release.js --project "${{ steps.select.outputs.modId }}"

      # Two accounts can finish close together, so the push is retried on top of the other's commit.
      - name: Commit data
        if: steps.select.outputs.mode == 'update'
        run: |
          git config user.name "Mod Factory Bot"
          git config user.email "bot@modfactory.dev"
          git add data/
          if git diff --staged --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "chore(update): ${{ steps.select.outputs.modId }} [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then exit 0; fi
            sleep $(( RANDOM % 20 + 5 ))
          done
          echo "::error::Could not push the data commit after 3 attempts"
          exit 1

      - name: Open issue with description section
        if: steps.skinrelease.outputs.released == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = JSON.parse(require('fs').readFileSync('./kit-issue.json', 'utf-8'));
            const { data } = await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, ...issue });
            core.notice(`Update issue created: ${data.html_url}`);

      - name: Save problem log on failure
        if: failure()
        run: |
          MOD_ID="${{ steps.select.outputs.modId || format('evening-{0}', matrix.account) }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H-%M-%SZ")
          LOG_DIR="Problem_logfile/${MOD_ID}/${TIMESTAMP}"
          mkdir -p "$LOG_DIR"
          {
            echo "# Pipeline Failure — ${MOD_ID}"
            echo ""
            echo "**Timestamp:** ${TIMESTAMP}"
            echo "**Workflow:** evening (update)"
            echo "**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$LOG_DIR/error.md"
          [ -f "data/skins/${MOD_ID}/pack.json" ] && cp "data/skins/${MOD_ID}/pack.json" "$LOG_DIR/" || true
          [ -f "data/projects/${MOD_ID}/project.json" ] && cp "data/projects/${MOD_ID}/project.json" "$LOG_DIR/" || true
          if [ -f "data/mods/${MOD_ID}/mod.json" ]; then cp "data/mods/${MOD_ID}/mod.json" "data/mods/${MOD_ID}/ModMain.java" "$LOG_DIR/" || true; fi
          [ -f build-output.txt ] && grep -E "error:|cannot find symbol|symbol:|location:|FAILED" build-output.txt > "$LOG_DIR/compile-errors.txt" || true
          git config user.name "Mod Factory Bot"
          git config user.email "bot@modfactory.dev"
          git checkout -- data/ || true
          git add "Problem_logfile/"
          git diff --staged --quiet || git commit -m "log: failure ${MOD_ID} ${TIMESTAMP} [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push || true

      - name: Create GitHub issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Evening update failed (${{ matrix.account }}): ${new Date().toISOString().split('T')[0]}`,
              body: `See [Actions run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).\n\nError log: \`Problem_logfile/\``,
              labels: ['pipeline-failure']
            });
